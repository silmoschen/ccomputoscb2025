<!-- Lectura de Stock.xml. Listado con paginación -->
<HTML>

<LINK REL="STYLESHEET" HREF="aranceles_os.css" TYPE="text/css">

<HEAD>
   <TITLE>Aranceles Obras Sociales</TITLE>
</HEAD>

<BODY><CENTER>

   <XML ID="dsoNom" SRC="aranceles_os.xml"></XML>

   <BUTTON ONCLICK="NomTabla.firstPage()">
      &lt;&lt; Primera página
   </BUTTON>

   <BUTTON ONCLICK="NomTabla.previousPage()">
      &lt; Anterior
   </BUTTON>

   <BUTTON ONCLICK="NomTabla.nextPage()">
      Siguiente &gt;
   </BUTTON>

   <BUTTON ONCLICK="NomTabla.lastPage()">
      Ultima página &gt;&gt;
   </BUTTON>
   <p>
   
   <TABLE WIDTH=750 ID="NomTabla" DATASRC="#dsoNom" DATAPAGESIZE="10" BORDER="1" CELLPADDING="2" BORDERCOLOR="black" CELLSPACING=0>

         <TH>Codigo</TH>
         <TH>Obra Social</TH>
         <TH>Periodo</TH>
         <TH>U.G.</TH>
         <TH>U.B.</TH>
         <TH>RIE U.G.</TH>
         <TH>RIE U.B.</TH>    
      </THEAD>     
      <TR ALIGN="center">
         <TD WIDTH=60><SPAN DATAFLD="codos"></SPAN></TD>
         <TD WIDTH=300><SPAN DATAFLD="obsocial"></SPAN></TD>
         <TD WIDTH=60><SPAN DATAFLD="periodo"></SPAN></TD>
         <TD WIDTH=60><SPAN DATAFLD="ub"></SPAN></TD>
         <TD WIDTH=60><SPAN DATAFLD="ug"></SPAN></TD>
         <TD WIDTH=60><SPAN DATAFLD="rieug"></SPAN></TD>
         <TD WIDTH=60><SPAN DATAFLD="rieub"></SPAN></TD>         
      </TR>
   </TABLE>

</CENTER></BODY>

</HTML>
