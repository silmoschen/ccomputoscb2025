<!-- Lectura de Stock.xml. Listado con paginación -->
<HTML>

<LINK REL="STYLESHEET" HREF="nomeclador.css" TYPE="text/css">

<HEAD>
   <TITLE>Nomeclador Nacional Normaliazado</TITLE>
</HEAD>

<BODY><CENTER>

   <XML ID="dsoNom" SRC="nomeclador.xml"></XML>

   <BUTTON ONCLICK="NomTabla.firstPage()">
      &lt;&lt; Primera página
   </BUTTON>

   <BUTTON ONCLICK="NomTabla.previousPage()">
      &lt; Anterior
   </BUTTON>

   <BUTTON ONCLICK="NomTabla.nextPage()">
      Siguiente &gt;
   </BUTTON>

   <BUTTON ONCLICK="NomTabla.lastPage()">
      Ultima página &gt;&gt;
   </BUTTON>
   <p>
   
   <TABLE WIDTH=750 ID="NomTabla" DATASRC="#dsoNom" DATAPAGESIZE="10" BORDER="1" CELLPADDING="2" BORDERCOLOR="black" CELLSPACING=0>
      <THEAD>
         <TH>Codigo</TH>
         <TH>Determinacion</TH>
         <TH>U.G.</TH>
         <TH>U.B.</TH>
         <TH>Cod.Fact.</TH>
         <TH>RIE</TH>
         <TH>RIE U.G.</TH>
         <TH>RIE U.B.</TH>    
         <TH>CF Toma</TH>                      
      </THEAD>     
      <TR ALIGN="center">
         <TD WIDTH=60><SPAN DATAFLD="codigo"></SPAN></TD>
         <TD WIDTH=370><SPAN DATAFLD="descrip"></SPAN></TD>
         <TD WIDTH=60><SPAN DATAFLD="gastos"></SPAN></TD>
         <TD WIDTH=60><SPAN DATAFLD="ub"></SPAN></TD>
         <TD WIDTH=60><SPAN DATAFLD="codfact"></SPAN></TD>
         <TD WIDTH=30><SPAN DATAFLD="rie"></SPAN></TD>
         <TD WIDTH=60><SPAN DATAFLD="ugrie"></SPAN></TD>
         <TD WIDTH=60><SPAN DATAFLD="ubrie"></SPAN></TD>
         <TD WIDTH=60><SPAN DATAFLD="cftoma"></SPAN></TD>
      </TR>
   </TABLE>

</CENTER></BODY>

</HTML>
